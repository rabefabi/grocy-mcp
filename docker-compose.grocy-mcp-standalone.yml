# Grocy MCP server as a standalone HTTPS endpoint, behind Caddy (Caddyfile.standalone).
#
#   cp .env.example .env   # set GROCY_URL, GROCY_API_TOKEN and MCP_BEARER_TOKEN
#   docker compose -f docker-compose.grocy-mcp-standalone.yml --env-file .env up -d --build
#
# MCP endpoint: https://<MCP_SITE_ADDRESS>:<MCP_HTTPS_PORT>/mcp with the header
# "Authorization: Bearer <MCP_BEARER_TOKEN>". Only Caddy's port is published.

name: grocy-mcp

services:

  grocy-mcp:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    container_name: grocy-mcp
    restart: unless-stopped
    environment:
      GROCY_URL: ${GROCY_URL:?Set GROCY_URL in .env}
      GROCY_API_TOKEN: ${GROCY_API_TOKEN:?Set GROCY_API_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_PORT: 8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    container_name: grocy-mcp-caddy
    restart: unless-stopped
    depends_on:
      - grocy-mcp
    ports:
      - "${MCP_HTTPS_PORT:-8443}:443"
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in .env}
      MCP_SITE_ADDRESS: ${MCP_SITE_ADDRESS:-localhost}
      MCP_TLS: ${MCP_TLS:-internal}
      MCP_ALLOWED_IPS: ${MCP_ALLOWED_IPS:-private_ranges}
    volumes:
      - ./Caddyfile.standalone:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
