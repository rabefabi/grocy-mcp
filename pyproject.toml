[project]
name = "grocy-mcp"
version = "0.1.0"
description = "Grocy MCP server for Home Assistant and AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.9,<2",
    "python-dotenv>=1.0",
    "Pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/rabefabi/grocy-mcp"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["grocy_mcp"]

[tool.coverage.report]
show_missing = true
